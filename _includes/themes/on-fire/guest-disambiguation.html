<div class="container page">
  <header class="page-heading">
    <p class="eyebrow">{{ page.guests.size }} guests share this name</p>
    <h1>{{ page.title }}</h1>
    {%- if page.tagline %}
    <p class="lede">{{ page.tagline }}</p>
    {%- endif %}
  </header>

  {% for guest in page.guests %}
    {% include themes/on-fire/guest-profile.html guest=guest %}
  {% endfor %}
</div>
