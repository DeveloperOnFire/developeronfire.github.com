<div class="page-header">
  <h1>{{ page.title }} {% if page.tagline %} <small>{{ page.tagline }}</small>{% endif %}</h1>
</div>

<div class="row">
  <main class="col-xs-12">
    {% for guest in page.guests %}
      {% include themes/bootstrap-3/guest-profile.html guest=guest %}
      <div class="col-xs-12">
        <hr>
      </div>
    {% endfor %}
  </main>
</div>
